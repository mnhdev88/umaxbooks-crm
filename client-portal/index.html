<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Your Documents · Noveliotech</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3A93;
    --ink: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #f1f3fa;
    color: var(--ink);
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    padding: 32px 14px 56px;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 40px rgba(31,58,147,.13);
    overflow: hidden;
  }
  .bar { height: 5px; background: linear-gradient(90deg,#1F3A93,#4a6cf7,#b8902a); }
  .pad { padding: 38px 30px 34px; text-align: center; }
  .icon { font-size: 40px; margin-bottom: 10px; }
  h1 { color: var(--navy); font-size: 19px; font-weight: 700; margin: 0 0 6px; }
  p.lede { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
  input {
    width: 100%;
    padding: 13px 14px;
    font-size: 17px;
    font-family: inherit;
    color: var(--ink);
    background: #f9fafb;
    border: 2px solid var(--line);
    border-radius: 12px;
    outline: none;
    text-align: center;
  }
  input:focus { border-color: var(--navy); }
  input.bad { border-color: #ef4444; }
  button {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--navy);
    border: none;
    border-radius: 10px;
    cursor: pointer;
  }
  button[disabled] { background: #9ca3af; cursor: not-allowed; }
  .msg { font-size: 13px; margin: 12px 0 0; line-height: 1.5; }
  .msg.err { color: #dc2626; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; line-height: 1.7; }
  .foot a { color: var(--navy); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="bar"></div>

    <div class="pad">
      <div class="icon">📄</div>
      <h1>Your documents</h1>
      <p class="lede">
        Enter the phone number or email address you gave us to open your
        proposal, agreement and website report.
      </p>
      <form id="form">
        <input id="identifier" type="text" inputmode="email" autocomplete="email"
               placeholder="Phone number or email" aria-label="Your phone number or email address"
               autofocus required>
        <p class="msg err" id="error" hidden></p>
        <button type="submit" id="submit">Open my documents</button>
      </form>
    </div>
  </div>

  <p class="foot">
    Trouble getting in? <a href="mailto:support@noveliotech.com">support@noveliotech.com</a><br>
    Noveliotech
  </p>
</div>

<script>
// The CRM serves the API and the documents. This page is a thin front door: it
// never sees a document, only a one-time URL to navigate to.
const API = 'https://crm.noveliotech.com';

const $ = (id) => document.getElementById(id);

function show(el, text) {
  el.textContent = text;
  el.hidden = !text;
}

// fetch() rejects with a bare TypeError ("Failed to fetch") for anything that
// stops the request before a response is read: no network, the CRM down, or a
// CORS refusal. The browser deliberately hides which. That message tells a
// client nothing, so show something they can act on and put the detail — with
// the origin, the usual culprit — in the console for whoever is debugging.
function failureMessage(e) {
  if (e instanceof TypeError) {
    console.error('[front door] request blocked or unreachable:', e,
                  '\n  page origin:', window.location.origin,
                  '\n  API:', API,
                  '\n  If this is a CORS refusal, add the origin above to CLIENT_PORTAL_ORIGINS on the CRM.');
    return "We couldn't reach our server. Check your connection and try again — if it keeps happening, email support@noveliotech.com.";
  }
  return e.message || 'Something went wrong. Please try again.';
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('submit');
  const err = $('error');
  const field = $('identifier');
  const identifier = field.value.trim();

  const looksEmail = identifier.includes('@');
  const looksPhone = identifier.replace(/\D/g, '').length >= 10;

  if (!looksEmail && !looksPhone) {
    show(err, 'Enter your full phone number (with area code) or your email address.');
    field.classList.add('bad');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Opening…';
  show(err, '');
  field.classList.remove('bad');

  try {
    const res = await fetch(API + '/api/public/client/open', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifier }),
    });
    const data = await res.json().catch(() => ({}));

    if (!res.ok) throw new Error(data.error || 'Something went wrong. Please try again.');

    if (!data.found) {
      show(err, "We don't have those details on file. Please check them, or contact us at support@noveliotech.com.");
      field.classList.add('bad');
    } else {
      // A top-level navigation, deliberately — the CRM sets its own cookie on
      // arrival. A fetch here would make it a third-party cookie and Safari
      // would drop it. The button stays disabled: the page is on its way out.
      window.location.href = data.url;
      return;
    }
  } catch (e) {
    show(err, failureMessage(e));
  }

  btn.disabled = false;
  btn.textContent = 'Open my documents';
});

$('identifier').addEventListener('input', () => {
  $('identifier').classList.remove('bad');
  show($('error'), '');
});
</script>

</body>
</html>
